server {
    listen 80;
    
    # Root directory where the static files are served
    root /usr/share/nginx/html;
    index index.html;

    # Any route that doesn't have a file extension should be redirected to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: configure cache headers for static assets
    location ~* \.(?:css|js|jpg|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
